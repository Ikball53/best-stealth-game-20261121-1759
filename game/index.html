<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink &amp; Ivory: The Map Vault</title>
<style>
  html, body { margin: 0; padding: 0; background: #10131c; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #wrap { position: relative; width: 960px; height: 640px; }
  canvas { display: block; background: #1a2030; border: 2px solid #3a4358; border-radius: 6px; }
  #muteBtn { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px; background: #232b3f; color: #d8deee; border: 1px solid #4a5674; border-radius: 4px; cursor: pointer; }
  #muteBtn:hover { background: #2e3852; }
  #hint { color: #8b96b4; font-size: 12px; margin-top: 8px; text-align: center; max-width: 960px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="960" height="640"></canvas>
  <button id="muteBtn" type="button">Sound: on</button>
</div>
<div id="hint">Move: WASD or arrows &middot; Sprint: Shift (noisy) &middot; Crouch: C &middot; Throw coin: click or Space &middot; Smoke: Q &middot; Restart: R &middot; Steal every atlas page, then reach the green door unseen.</div>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/vision.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
